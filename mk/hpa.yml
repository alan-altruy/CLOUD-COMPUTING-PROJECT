apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webapp-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webapp # Doit correspondre exactement au metadata.name de ta webapp
  minReplicas: 1
  maxReplicas: 5 # Limite haute pour éviter de surcharger ton Minikube
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50 # Si le CPU moyen dépasse 50% de sa "request" (soit > 50m), K8s scale-up